version: 2
updates:
  # Rust crates wait 3 days after a release. Minor and patch updates come as
  # one weekly PR, each major as its own PR. Security updates skip the wait.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore

  # Triton, torch and the CUDA packages are pinned on purpose. The frontend
  # reads Triton internals and the validation records name exact versions,
  # so they move by hand after the model is checked again.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: triton
      - dependency-name: torch
      - dependency-name: cuda-bindings
      - dependency-name: nvidia-ml-py
    commit-message:
      prefix: chore

  # Keeps the SHA pinned actions current. The cooldown skips releases younger
  # than a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
