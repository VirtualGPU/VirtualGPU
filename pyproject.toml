[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "virtualgpu"
version = "0.2.0"
description = "Predict the relative performance of GPU kernel variants without the GPU"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
dependencies = ["jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/VirtualGPU/VirtualGPU"
Repository = "https://github.com/VirtualGPU/VirtualGPU"

[project.scripts]
virtualgpu = "virtualgpu.cli:main"

[project.optional-dependencies]
# The frontend calls Triton internals; upgrade only after re-validating it.
triton = ["triton==3.9.0"]
# Hardware runner and scoring in validation/.
validation = [
    "numpy>=2,<3",
    "nvidia-ml-py>=13.615.71,<14",
    "cuda-bindings>=12.9.11,<14",
    "torch==2.15.0",
    "triton==3.9.0",
]

[dependency-groups]
# Local and CI tools. Triton only installs on Linux.
dev = [
    "maturin>=1.7,<2",
    "pytest>=8",
    "ruff==0.17.6",
    "pre-commit>=4",
    "jsonschema>=4",
    "numpy>=2,<3",
    "triton==3.9.0; sys_platform == 'linux'",
]

[tool.maturin]
manifest-path = "crates/vgpu-core/Cargo.toml"
python-source = "python"
module-name = "virtualgpu._core"
features = ["python"]
include = [
    { path = "schemas/*.json", format = "sdist" },
    { path = "profiles/*.json", format = "sdist" },
    { path = "python/virtualgpu/profiles/*.json", format = ["sdist", "wheel"] },
]

[tool.ruff]
target-version = "py310"
line-length = 100
# Sealed records hash these sources, so they are never reformatted.
extend-exclude = ["validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The formatter owns line length, and zip strict would change behavior.
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
